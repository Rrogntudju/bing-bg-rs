[package]
name = "bingbg"
version = "0.3.0"
authors = ["Rrogntudju"]
edition = "2024"

[dependencies]
reqwest = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
log = "0.4"
systemd-journal-logger = "2"
anyhow = "1"
cosmic-bg-config = { git = "https://github.com/pop-os/cosmic-bg.git" }

[profile.release]
lto = true
opt-level = "s"            
panic = "abort"            
split-debuginfo = "packed"  
strip = "symbols" 