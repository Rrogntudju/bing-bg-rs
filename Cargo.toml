[package]
name = "bingbg"
version = "0.2.0"
authors = ["Rrogntudju"]
edition = "2024"

[dependencies]
reqwest = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
rand = "0.9"
cosmic-bg-config = { git = "https://github.com/pop-os/cosmic-bg.git" }

[profile.release]
opt-level = 3
lto = "thin"